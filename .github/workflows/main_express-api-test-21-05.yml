# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - express-api-test-21-05

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Enable pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Setup Node.js
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # Enable Corepack
      - name: Enable Corepack
        run: corepack enable

      # Install dependencies
      - name: Install dependencies
        run: pnpm install

      # Build app
      - name: Build application
        run: pnpm build --if-present

      # Run tests
      - name: Run tests
        run: pnpm test --if-present

      # Upload artifact
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      # Download build artifact
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1814B7B6975745188DFFCFA12912BFAE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B50AA9F2B4BB4BA48C861ADE06F0467D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_860D3C62469D4D8589ED3C1E8F7224A5 }}

      # Deploy to Azure App Service
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'express-api-test-21-05'
          slot-name: 'Production'
          package: .